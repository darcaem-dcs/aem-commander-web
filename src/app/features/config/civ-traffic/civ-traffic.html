<div class="module-pane active-pane">
  <div style="display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid var(--border-color); padding-bottom: 10px; margin-bottom: 20px;">
    <h2 style="margin: 0; font-size: 1.5em; color: var(--text-main);">Civilian Air Traffic</h2>
    <label class="switch">
      <input type="checkbox"
             [ngModel]="stateService.config().civEnabled"
             (ngModelChange)="stateService.updateConfig({ civEnabled: $event })">
      <span class="slider"></span>
    </label>
  </div>
  
  <p style="font-size: 0.9em; color: var(--text-muted); margin-bottom: 20px;">
    Populates the theater with random civilian airliner flights traveling between major airports to provide a living environment.
  </p>
</div>
