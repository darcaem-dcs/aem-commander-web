<div class="module-pane active-pane">
  <div style="display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid var(--border-color); padding-bottom: 10px; margin-bottom: 20px;">
    <h2 style="margin: 0; font-size: 1.5em; color: var(--text-main);">Quick Reaction Alert (QRA)</h2>
    <label class="switch">
      <input type="checkbox"
             [ngModel]="stateService.config().qraEnabled"
             (ngModelChange)="stateService.updateConfig({ qraEnabled: $event })">
      <span class="slider"></span>
    </label>
  </div>
  
  <p style="font-size: 0.9em; color: var(--text-muted); margin-bottom: 20px;">
    Randomly spawns unresponsive bogeys entering the airspace, requiring player interception, visual identification, and radio warnings.
  </p>
</div>
